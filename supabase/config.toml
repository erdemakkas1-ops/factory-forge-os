project_id = "lxusmauddygcubmcaorb"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:*/**"]
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.sms]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.invite-employee]
enabled = true
verify_jwt = true
import_map = "./functions/invite-employee/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/invite-employee/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/invite-employee/*.html" ]
